name: Container image

on:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded build of the same ref is wasted work: this image takes a long time to build.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dokploy-oss

jobs:
  # Every merge to main gets its own version, derived from the upstream base this fork sits on
  # plus the run number. Semver orders those prereleases numerically, so each build is newer
  # than the last, and rebasing onto a newer upstream raises the base and stays ordered.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: |
          BASE=$(node -p "require('./apps/dokploy/package.json').version" | sed 's/^v//')
          VERSION="${BASE}-akaike.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

  build:
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile copies .env.production into the image as its .env.
      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            PANEL_VERSION=${{ needs.version.outputs.version }}
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # The panel's update check looks for a tag starting with "v" that shares a digest with
  # "latest", so both have to be published from the same manifest.
  manifest:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for TAG in "latest" "v${VERSION}"; do
            docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:build-amd64" \
              "${IMAGE_NAME}:build-arm64"
            echo "Pushed ${IMAGE_NAME}:${TAG}"
          done
          echo "### Published \`${IMAGE_NAME}:v${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

  # Tags are not covered by branch protection, so this needs no bypass.
  release:
    needs: [version, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: install.sh
