name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A superseded build of the same ref is wasted work: this image takes a long time to build.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile copies .env.production into the image as its .env.
      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:build-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          TAGS="latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${{ github.ref_name }} latest"
          fi
          echo "list=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifests
        run: |
          for TAG in ${{ steps.tags.outputs.list }}; do
            docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:build-amd64" \
              "${IMAGE_NAME}:build-arm64"
            echo "Pushed ${IMAGE_NAME}:${TAG}"
          done

  release:
    needs: [manifest]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish release with the installer attached
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: install.sh
